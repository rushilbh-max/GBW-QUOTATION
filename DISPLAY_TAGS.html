<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GBW Display Tags</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#a8834f;--tan:#c2b19c;--tan2:#efe8dd;--ink:#1f1d1a;--muted:#6f675c;--bg:#f6f3ee;--line:#e2dace;--card:#fff;--red:#b3261e;--green:#2e7d4f;--blue:#2b5fa8}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Jost,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button{font-family:inherit;font-size:13px;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#000}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:4px 9px;font-size:12px}
/* top bar */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.05}
.brand b{font-family:Cinzel,serif;font-size:19px;letter-spacing:.06em;font-weight:700}
.brand span{font-size:11px;letter-spacing:.22em;color:var(--gold);font-weight:600;text-transform:uppercase}
.tabs{display:flex;gap:4px;background:var(--tan2);border-radius:10px;padding:3px;margin-left:12px}
.tabs button{border:0;background:transparent;padding:7px 16px;border-radius:8px;font-weight:600;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.spacer{flex:1}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;max-width:440px}
.status .dot{width:8px;height:8px;border-radius:50%;background:#bbb;flex:none}
.status .dot.ok{background:var(--green)}.status .dot.busy{background:#e0a100;animation:pulse 1s infinite}.status .dot.err{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
.badge{background:var(--red);color:#fff;border-radius:10px;padding:0 7px;font-size:11px;font-weight:700}
.banner{background:#fff4db;border-bottom:1px solid #ecd9a8;padding:8px 18px;font-size:13px;display:flex;gap:10px;align-items:center}
.banner.hide{display:none}
/* layout */
.view{display:none;height:calc(100vh - 61px)}
.view.on{display:flex}
.side{width:270px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.search{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.pl{overflow:auto;flex:1;padding:6px}
.pl-item{display:flex;align-items:center;gap:6px;padding:8px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent;position:relative}
.pl-item:hover{background:var(--bg)}
.pl-item.on{background:var(--tan2);border-color:var(--tan)}
.pl-item.dragover{border-top:2px solid var(--gold)}
.pl-grip{color:#bbb;cursor:grab;font-size:12px;letter-spacing:-2px;user-select:none}
.pl-main{flex:1;min-width:0}
.pl-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.pl-title{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-meta{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.chg{width:7px;height:7px;border-radius:50%;background:#e0a100;display:inline-block}
.sz{font-size:10px;font-weight:700;border-radius:5px;padding:1px 5px;border:1px solid}
.sz-S{color:#2b7a5a;border-color:#9fd1bb}.sz-M{color:#2b5fa8;border-color:#a9c1e6}.sz-L{color:#8a4b9c;border-color:#d4b4dd}
.warn{color:#fff;background:#d97706;border-radius:50%;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.main{flex:1;min-width:0;overflow:auto;padding:14px 14px 40px}
.ed-wrap{display:flex;gap:18px;align-items:flex-start}
.ed-col{flex:1;min-width:0;overflow-x:auto}
.live{width:290px;flex:none;position:sticky;top:0}
.live h4,.panel-box h4{margin:0 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.live-box{background:#d9d3c9;border-radius:10px;padding:12px;display:flex;justify-content:center;overflow:hidden}
.live-note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45}
.ed-head{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px}
.field.grow{flex:1;min-width:160px}
.field label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
.field input:focus,.items input:focus,.search:focus{outline:2px solid var(--tan);border-color:var(--gold)}
#pName{width:110px;font-weight:700;font-size:15px;text-transform:uppercase}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 11px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.ed-actions{display:flex;gap:6px}
.items{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.items th{white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:9px 8px;background:#faf8f4;border-bottom:1px solid var(--line)}
.items td{padding:5px 4px;border-bottom:1px solid #f0ebe3;vertical-align:middle}
.items tr:last-child td{border-bottom:0}
.items tr.dragover td{border-top:2px solid var(--gold)}
.items tr.dragging{opacity:.4}
.items .grip{cursor:grab;color:#bbb;width:22px;text-align:center;user-select:none}
.items .num{width:30px;font-weight:700;color:var(--muted)}
.thumb{width:40px;height:40px;object-fit:contain;background:#fff;border:1px solid #eee;border-radius:6px;display:block}
.thumb.none{display:flex;align-items:center;justify-content:center;font-size:9px;color:#aaa;text-align:center}
.code-in{width:148px;border:1px solid var(--line);border-radius:7px;padding:7px 6px;font-weight:600;font-size:12.5px;letter-spacing:0;text-transform:uppercase}
.qty{width:50px;border:1px solid var(--line);border-radius:7px;padding:7px 6px;text-align:center}
.desc{font-size:12px;line-height:1.3;min-width:120px}
.r{text-align:right;white-space:nowrap}
.mrp{font-weight:600}
.acts{white-space:nowrap;text-align:right}
.acts button{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 4px;color:var(--muted);font-size:14px;line-height:1}
.acts button:hover{border-color:var(--line);color:var(--ink);background:#fff}
.acts button.del:hover{color:var(--red)}
.chip{display:inline-block;font-size:10px;font-weight:700;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.chip.bad{background:#fde7e5;color:var(--red)}.chip.mid{background:#fff1d6;color:#9a5b00}
.addbar{display:flex;gap:8px;margin-top:12px;align-items:center}
.addbar .code-in{flex:1;width:auto;text-transform:none;font-weight:500;padding:10px 12px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.welcome{max-width:640px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;line-height:1.55}
.welcome h2{font-family:Cinzel,serif;margin:0 0 8px}
/* autocomplete */
.ac{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);max-height:380px;overflow:auto;display:none;width:560px}
.ac-row{display:flex;gap:10px;align-items:center;padding:6px 10px;cursor:pointer;border-bottom:1px solid #f3efe8}
.ac-row.on,.ac-row:hover{background:var(--tan2)}
.ac-row img,.ac-row .noimg{width:38px;height:38px;object-fit:contain;flex:none;border-radius:5px;background:#fff;border:1px solid #eee}
.ac-row .t{flex:1;min-width:0}
.ac-row .c{font-weight:700;font-size:13px}
.ac-row .d{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-row .m{font-weight:600;font-size:13px;white-space:nowrap}
.ac-foot{padding:6px 10px;font-size:11px;color:var(--muted)}
mark{background:#ffe9a8;color:inherit;padding:0}
/* print view */
.pside{width:330px}
.pside .sec{padding:12px;border-bottom:1px solid var(--line)}
.pside .sec h4{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.prow{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:6px;font-size:13px}
.prow:hover{background:var(--bg)}
.gchips{display:flex;flex-wrap:wrap;gap:5px}
.gchip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:3px 10px;font-weight:700;font-size:12px;color:var(--ink)}
.gchip small{font-weight:500;color:var(--muted)}
.gchip.on{background:var(--ink);border-color:var(--ink);color:#fff}.gchip.on small{color:#d8cfc2}
.gchip.part{border-color:var(--gold);background:var(--tan2)}
.prow .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .nm small{font-weight:400;color:var(--muted);margin-left:4px}
.prow select{border:1px solid var(--line);border-radius:6px;padding:2px 4px;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .field input{width:100%}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:6px}
.stats{background:var(--tan2);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5}
.stats b{font-size:18px}
.pv{flex:1;overflow:auto;background:#d9d3c9;padding:20px}
.pv-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;font-size:13px}
.pv-pages{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.pv-page{background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.pv-cap{font-size:11px;color:#5b544a;margin-top:4px;text-align:center}
/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(20,18,15,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0 0 6px;font-family:Cinzel,serif}
.modal p{color:var(--muted);line-height:1.5;margin:6px 0 12px}
.modal .field{margin-bottom:12px}
.modal .field input,.modal .field textarea{width:100%}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.modal.wide{max-width:860px}
.drop{border:2px dashed var(--tan);border-radius:12px;padding:18px;text-align:center;color:var(--muted);background:var(--bg);cursor:pointer}
.drop.over{border-color:var(--gold);background:var(--tan2)}
.upt{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.upt th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);background:#faf8f4;position:sticky;top:0}
.upt td{padding:7px 8px;border-bottom:1px solid #f0ebe3;vertical-align:top}
.upt .new{color:var(--green);font-weight:700}
.upt-wrap{max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.lnk{background:none;border:0;color:var(--blue);text-decoration:underline;padding:0;font-size:12.5px}
.help{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 14px;line-height:1.55}
.help ol{margin:4px 0;padding-left:18px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;z-index:90;font-size:13px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.toast.err{background:var(--red)}
/* ======== TAG / SHEET (print units: mm) ======== */
.sheet{position:relative;width:210mm;height:297mm;background:#fff;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.slot{position:absolute}
.cut-h,.cut-v{position:absolute;border:0 dashed #b9b0a3}
.cut-h{border-top-width:.2mm;height:0}
.cut-v{border-left-width:.2mm;width:0}
.cut-box{position:absolute;border:.2mm dashed #cfc7bb}
.tag{position:relative;width:100%;height:100%;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-family:Jost,sans-serif;color:#1f1d1a}
.tag-frame{position:absolute;border:.35mm solid #a8834f;border-radius:2mm;display:flex;flex-direction:column;overflow:hidden}
.tag-head{display:flex;align-items:center;gap:2mm;border-bottom:.3mm solid #c2b19c;flex:none}
.th-left{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.th-brand{font-family:Cinzel,serif;font-weight:700;letter-spacing:.14em;color:#a8834f;white-space:nowrap;line-height:1.1}
.th-title{font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;line-height:1.15}
.th-pill{flex:none;white-space:nowrap;overflow:hidden;background:#1f1d1a;color:#fff;font-weight:700;border-radius:1.6mm;line-height:1;letter-spacing:.02em;text-align:center}
.tag-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.tag-grid{display:flex;flex-direction:column;align-items:center;justify-content:center}
.tag-row{display:flex;justify-content:center;flex-wrap:nowrap}
.card{flex:none}
.card{position:relative;border:.25mm solid #ddd5c9;border-radius:1.4mm;display:flex;flex-direction:column;overflow:hidden;background:#fff}
.c-img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:.8mm}
.c-img img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.c-img .noimg{color:#bbb;font-size:2mm;text-align:center}
.c-txt{flex:none;padding:0 .9mm .9mm;text-align:center}
.c-code{font-weight:700;white-space:nowrap;overflow:hidden;line-height:1.2;letter-spacing:.01em}
.c-desc{color:#4a443c;line-height:1.16;overflow:hidden;max-height:2.34em;word-break:break-word}
.c-desc.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.c-mrp{font-weight:700;line-height:1.2;margin-top:.4mm;white-space:nowrap;border-top:.2mm solid #eee5d8;padding-top:.4mm}
.c-mrp .l{font-weight:600;color:#a8834f;font-size:.62em;letter-spacing:.08em;margin-right:.6mm;vertical-align:.12em}
.c-num{position:absolute;left:.7mm;top:.7mm;background:#a8834f;color:#fff;border-radius:50%;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
.c-qty{position:absolute;right:.7mm;top:.7mm;background:#1f1d1a;color:#fff;border-radius:1mm;font-weight:700;line-height:1;padding:.4mm .8mm}
.tag-foot{flex:none;display:flex;justify-content:space-between;align-items:center;color:#7a7268;border-top:.2mm solid #eee5d8;white-space:nowrap;overflow:hidden}
.ttag{position:relative;background:#fff;overflow:hidden;display:flex;flex-direction:column;font-family:Jost,'Segoe UI',Arial,sans-serif;color:#1d1b18;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.tt-banner{flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:.8mm}
.tt-banner img{max-width:92%;max-height:100%;object-fit:contain}
.tt-title{flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;color:#8a6d43}
.tt-box{flex:none;border:.3mm solid #b39468;border-radius:2.2mm;overflow:hidden;background:#fff}
.tt-head{display:flex;background:#1e1c19;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;border-bottom:.5mm solid #b39468}
.th-c{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;overflow:hidden;padding:0 1mm;line-height:1.05}
.th-mid{border-left:.2mm solid #4a443b;border-right:.2mm solid #4a443b}
.th-k{font-size:1.45mm;letter-spacing:.28em;color:#cdb48a;font-weight:600;margin-bottom:.5mm;white-space:nowrap}
.th-lbl{font-size:2.1mm;letter-spacing:.3em;font-weight:600;color:#f3ece0;white-space:nowrap}
.th-name{font-weight:700;color:#e2c58f;letter-spacing:.04em;white-space:nowrap;overflow:hidden;max-width:100%}
.th-name small{font-size:.55em;color:#cdb48a;font-weight:600}
.th-tot{font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;max-width:100%}
.tt-row{display:flex;border-top:.2mm solid #e8dfd1}
.tt-row:first-of-type{border-top:0}
.tt-row.alt{background:#faf7f1}
.tc{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;overflow:hidden;padding:0 1mm}
.tc+.tc{border-left:.2mm solid #eee6d9}
.t-code{font-weight:600;white-space:nowrap;overflow:hidden;letter-spacing:.02em;max-width:100%;color:#1d1b18}
.t-img{padding:0}
.t-img img{max-width:100%;object-fit:contain;display:block;margin:0 auto;mix-blend-mode:multiply;transform:scale(1.14)}
.t-img .noimg{color:#b9ae9c;font-size:1.6mm;letter-spacing:.08em;text-transform:uppercase}
.t-mrp{font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;max-width:100%}
.t-mrp .rs{font-size:.72em;color:#9b7b4b;margin-right:.6mm;font-weight:600}
.t-q{font-weight:600;color:#fff;background:#9b7b4b;border-radius:.8mm;padding:.15mm .9mm;margin-top:.5mm;line-height:1.2;white-space:nowrap}
.t-desc{line-height:1.16;max-height:2.34em;overflow:hidden;text-align:center;color:#4a443c;font-weight:500;word-break:break-word}
.tt-foot{flex:none;display:flex;align-items:flex-end;justify-content:center;font-size:1.6mm;letter-spacing:.18em;text-transform:uppercase;color:#9b8f7c;white-space:nowrap}
#printRoot{display:none}
@page{size:A4 portrait;margin:0}
@media print{
  html,body{background:#fff;height:auto}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block}
  #printRoot .sheet{page-break-after:always;break-after:page;box-shadow:none;margin:0}
  #printRoot .sheet:last-child{page-break-after:auto;break-after:auto}
  #printRoot .sheet{height:296.8mm}
}
@media (max-width:1180px){.live{display:none}}
@media (max-width:800px){.side{width:200px}.status{display:none}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><b>GRACE BATH WORLD</b><span>Display Tags</span></div>
  <nav class="tabs"><button id="tabEdit" class="on">Panels &amp; Items</button><button id="tabPrint">Print Tags</button></nav>
  <div class="spacer"></div>
  <div class="status" id="status"><span class="dot"></span><span>Starting…</span></div>
  <button class="btn" id="btnUndo" title="Undo (Ctrl+Z)">↶ Undo</button>
  <button class="btn" id="btnRefresh" title="Reload catalogue and panels from Google Sheets">⟳ Refresh</button>
  <button class="btn gold" id="btnSave" disabled>Save to Sheet</button>
  <button class="btn" id="btnSettings" title="Settings">⚙</button>
</header>
<div class="banner hide" id="banner"></div>

<section class="view on" id="viewEdit">
  <aside class="side">
    <div class="side-head">
      <input class="search" id="plSearch" placeholder="Search panel or item code…">
      <div style="display:flex;gap:6px"><button class="btn sm" id="btnNewPanel" style="flex:1">＋ New panel</button><button class="btn sm" id="btnUpload" style="flex:1" title="Upload AREA · CODE · QTY from Excel / CSV">⬆ Upload codes</button></div>
    </div>
    <div class="pl" id="panelList"></div>
  </aside>
  <div class="main" id="editMain"></div>
</section>

<section class="view" id="viewPrint">
  <aside class="side pside" id="printSide"></aside>
  <div class="pv" id="pv">

/* fast CSV parser (gviz quotes every field) */
function parseCSV(t){
  var rows=[], row=[], i=0, n=t.length, j, ch, s, val;
  if(t.charCodeAt(0)===0xFEFF) i=1;
  while(i<n){
    if(t[i]==='"'){
      s=i+1; val='';
      for(;;){ j=t.indexOf('"',s); if(j<0){ val+=t.slice(s); i=n; break; } if(t[j+1]==='"'){ val+=t.slice(s,j+1); s=j+2; continue; } val+=t.slice(s,j); i=j+1; break; }
      row.push(val);
    } else {
      j=i; while(j<n){ ch=t[j]; if(ch===','||ch==='\n'||ch==='\r') break; j++; }
      row.push(t.slice(i,j)); i=j;
    }
    if(i>=n){ rows.push(row); row=null; break; }
    ch=t[i];
    if(ch===','){ i++; if(i>=n){ row.push(''); rows.push(row); row=null; break; } continue; }
    rows.push(row); row=[]; if(ch==='\r'&&t[i+1]==='\n') i++; i++;
  }
  if(row && row.length) rows.push(row);
  return rows;
}
function hdrIndex(h, names){ for(var k=0;k<names.length;k++){ for(var i=0;i<h.length;i++){ if(h[i]===names[k]) return i; } } return -1; }
function normH(s){ return String(s||'').trim().toUpperCase().replace(/[-_\d]+$/,'').replace(/\s+/g,' ').trim(); }

function idbGet(k){ return idb().then(function(db){ return new Promise(function(res){ var q=db.transaction('kv','readonly').objectStore('kv').get(k); q.onsuccess=function(){ res(q.result); }; q.onerror=function(){ res(null); }; }); }).catch(function(){ return null; }); }
function idbSet(k,v){ return idb().then(function(db){ return new Promise(function(res){ var tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=function(){res(true);}; tx.onerror=function(){res(false);}; }); }).catch(function(){ return false; }); }

/* ================= CATALOGUE ================= */
function buildCatalogue(csv){
  var r=parseCSV(csv); if(!r.length) throw new Error('CODE NEW is empty');
  var h=r[0].map(normH);
  var ic=hdrIndex(h,['CODE']), id=hdrIndex(h,['DESCRIPTION','DESC','ITEM NAME']), im=hdrIndex(h,['MRP']), ib=hdrIndex(h,['BRAND']);
  if(ic<0||im<0) throw new Error('CODE NEW: CODE / MRP columns not found');
  var C={codes:[],descs:[],mrps:[],brands:[],hay:[],cu:[],map:new Map(),n:0};
  for(var i=1;i<r.length;i++){
    var row=r[i], c=String(row[ic]||'').trim(); if(!c) continue;
    var u=c.toUpperCase(); if(C.map.has(u)) continue;
    var d=id>=0?String(row[id]||'').trim():'';
    var k=C.codes.length;
    C.codes.push(c); C.descs.push(d); C.mrps.push(num(row[im])); C.brands.push(ib>=0?String(row[ib]||'').trim():'');
    C.cu.push(u); C.hay.push(u+' '+u.replace(/-/g,'')+' '+d.toUpperCase());
    C.map.set(u,k);
  }
  C.n=C.codes.length; return C;
}
function buildImages(csv){
  var r=parseCSV(csv); var m=new Map(); if(!r.length) return m;
  var h=r[0].map(normH); var ic=hdrIndex(h,['CODE']), iu=hdrIndex(h,['IMAGE URL','IMAGE','URL']);
  if(ic<0||iu<0) throw new Error('IMAGE NEW: CODE / IMAGE URL columns not found');
  for(var i=1;i<r.length;i++){ var c=String(r[i][ic]||'').trim().toUpperCase(), u=fixUrl(r[i][iu]); if(c&&u&&!m.has(c)) m.set(c,u); }
  return m;
}
function info(code){
  var u=String(code||'').trim().toUpperCase(); var k=CAT.map.get(u);
  var o={code:String(code||'').trim(), desc:'', mrp:NaN, brand:'', known:false, img:IMG.get(u)||''};
  if(k!==undefined){ o.code=CAT.codes[k]; o.desc=CAT.descs[k]; o.mrp=CAT.mrps[k]; o.brand=CAT.brands[k]; o.known=true; }
  return o;
}

/* ================= PANELS DATA ================= */
function buildPanels(areas, meta){
  var map={}, order=[];
  (meta||[]).forEach(function(m){ var a=String(m[0]||'').trim().toUpperCase(); if(!a||map[a]) return; var sz=String(m[2]||'AUTO').trim().toUpperCase(); if(!/^[1-9]$/.test(sz)) sz='AUTO'; map[a]={uid:uid(),name:a,title:String(m[1]||'').trim(),size:sz,showTotal:!/^(N|NO|FALSE|0|HIDE)\b/i.test(String(m[3]==null?'':m[3]).trim()),showDesc:/DESC/i.test(String(m[3]==null?'':m[3])),items:[]}; order.push(map[a]); });
  var tmp={};
  (areas||[]).forEach(function(r,i){
    var code=String(r[0]||'').trim(), a=String(r[1]||'').trim().toUpperCase(); if(!code||!a) return;
    var q=num(r[2]); if(!(q>0)) q=0; var s=num(r[3]);
    if(!map[a]){ map[a]={uid:uid(),name:a,title:'',size:'AUTO',showTotal:true,showDesc:false,items:[]}; order.push(map[a]); }
    (tmp[a]=tmp[a]||[]).push({code:code.toUpperCase(),qty:q,s:isFinite(s)?s:1e9,i:i});
  });
  Object.keys(tmp).forEach(function(a){ tmp[a].sort(function(x,y){ return (x.s-y.s)||(x.i-y.i); }); map[a].items=tmp[a].map(function(x){ return {code:x.code,qty:x.qty}; }); });
  return order;
}
function serialize(panels){
  var areas=[], meta=[];
  panels.forEach(function(p){
    meta.push([p.name, p.title||'', p.size||'AUTO', (p.showTotal===false?'N':'Y')+(p.showDesc?' DESC':'')]);
    var s=0; p.items.forEach(function(it){ var c=canon(it.code); if(!c) return; s++; areas.push([c, p.name, it.qty>0?it.qty:'', s]); });
  });
  return {areas:areas, panels:meta};
}
function sigPanel(p){ return JSON.stringify([p.title||'', p.size||'AUTO', p.showTotal!==false, !!p.showDesc, p.items.filter(function(i){return canon(i.code);}).map(function(i){ return [canon(i.code), i.qty]; })]); }
function changedSet(){
  var bm={}; S.base.forEach(function(b){ bm[b.name]=sigPanel(b); });
  var ch={}; S.panels.forEach(function(p){ if(bm[p.name]===undefined || bm[p.name]!==sigPanel(p)) ch[p.uid]=true; });
  return ch;
}
function dirtyInfo(){
  var a=JSON.stringify(serialize(S.panels)), b=JSON.stringify(serialize(S.base));
  if(a===b) return {dirty:false,n:0};
  var ch=changedSet(), n=Object.keys(ch).length;
  var names={}; S.panels.forEach(function(p){names[p.name]=1;}); S.base.forEach(function(b){ if(!names[b.name]) n++; });
  return {dirty:true, n:n};
}
function saveDraft(){
  var d=dirtyInfo();
  if(d.dirty) saveJSON(LS_DRAFT,{time:Date.now(), baseVersion:S.version, panels:S.panels});
  else localStorage.removeItem(LS_DRAFT);
}
function getPanel(u){ for(var i=0;i<S.panels.length;i++) if(S.panels[i].uid===u) return S.panels[i]; return null; }
function curPanel(){ return getPanel(S.sel) || S.panels[0] || null; }

/* undo */
function pushUndo(){ S.undo.push(JSON.stringify({panels:S.panels, sel:S.sel})); if(S.undo.length>80) S.undo.shift(); $('btnUndo').disabled=false; }
function undo(){ if(!S.undo.length) return; var o=JSON.parse(S.undo.pop()); S.panels=o.panels; S.sel=o.sel; afterChange(true); toast('Undone'); $('btnUndo').disabled=!S.undo.length; }
function mutate(fn){ pushUndo(); fn(); afterChange(true); }
function afterChange(full){ saveDraft(); updateSaveBtn(); renderPanelList(); if(full) renderEditor(); else renderLive(); if(S.view==='print') renderPrint(); }

/* ================= SYNC ================= */
var syncing=false;
function syncCatalogue(){
  setStatus('busy','Loading catalogue (CODE NEW + IMAGE NEW)…');
  return Promise.all([fetchText(gviz(CFG.catId,'CODE NEW')), fetchText(gviz(CFG.catId,'IMAGE NEW'))]).then(function(t){
    var c=buildCatalogue(t[0]), m=buildImages(t[1]);
    CAT=c; IMG=m; idbSet('cat_csv',t[0]); idbSet('img_csv',t[1]); idbSet('cat_time',Date.now());
    return true;
  });
}
function fetchPanels(){
  if(CFG.scriptUrl){
    return fetch(CFG.scriptUrl+(CFG.scriptUrl.indexOf('?')<0?'?':'&')+'action=get&_='+Date.now()).then(function(r){ return r.json(); }).then(function(j){
      if(!j||!j.ok) throw new Error((j&&j.error)||'Apps Script error');
      return {version:j.version||null, areas:j.areas||[], panels:j.panels||[], src:'script'};
    });
  }
  if(CFG.sheetId){
    var a=fetchText(gviz(CFG.sheetId,'AREAS')), m=fetchText(gviz(CFG.sheetId,'PANELS')).catch(function(){ return ''; });
    return Promise.all([a,m]).then(function(t){
      var ar=parseCSV(t[0]); var h=(ar[0]||[]).map(normH);
      if(hdrIndex(h,['CODE'])<0||hdrIndex(h,['AREA'])<0) throw new Error('AREAS tab must have CODE and AREA columns');
      var ic=hdrIndex(h,['CODE']), ia=hdrIndex(h,['AREA']), iq=hdrIndex(h,['QTY']), is=hdrIndex(h,['SERIES']);
      var areas=ar.slice(1).map(function(r){ return [r[ic], r[ia], iq>=0?r[iq]:1, is>=0?r[is]:'']; });
      var meta=[]; if(t[1]){ var mr=parseCSV(t[1]); var mh=(mr[0]||[]).map(normH); if(hdrIndex(mh,['TITLE'])>=0&&hdrIndex(mh,['AREA'])>=0){ var a1=hdrIndex(mh,['AREA']),t1=hdrIndex(mh,['TITLE']),s1=hdrIndex(mh,['SIZE']); meta=mr.slice(1).map(function(r){ return [r[a1],r[t1],s1>=0?r[s1]:'AUTO']; }); } }
      return {version:null, areas:areas, panels:meta, src:'sheet'};
    });
  }
  return Promise.resolve(null);
}
function applySheetData(d, fromCache){
  if(!d) return;
  var base=buildPanels(d.areas, d.panels);
  S.printSel=null;
  var prevVersion=S.version;
  S.base=base; S.version=d.version; S.loadedPanels=true;
  var draft=loadJSON(LS_DRAFT,null);
  if(draft && draft.panels){
    if(!S.panels.length || fromCache) S.panels=draft.panels;
    if(!fromCache && draft.baseVersion && d.version && draft.baseVersion!==d.version) showBanner('The Google Sheet was changed (another device?) after your unsaved edits from '+fmtTime(draft.time)+'.', true);
    else if(!fromCache) showBanner('You have unsaved changes from '+fmtTime(draft.time)+'. Click <b>Save to Sheet</b> when ready.', true);
  } else {
    S.panels=clone(base);
  }
  if(!getPanel(S.sel)) S.sel=S.panels[0]?S.panels[0].uid:null;
  if(!fromCache) saveJSON(LS_SHEET,{time:Date.now(), version:d.version, areas:d.areas, panels:d.panels});
}
function syncAll(){
  if(syncing) return; syncing=true;
  var errs=[];
  var pc=syncCatalogue().catch(function(e){ errs.push(location.protocol==='file:'?'Catalogue blocked: open this app from its web link (GitHub Pages), not as a downloaded file':'Catalogue: '+e.message); });
  var pp=fetchPanels().then(function(d){ if(d){ if(dirtyInfo().dirty && S.loadedPanels){ S.base=buildPanels(d.areas,d.panels); var dv=S.version; S.version=d.version; saveJSON(LS_SHEET,{time:Date.now(),version:d.version,areas:d.areas,panels:d.panels}); if(dv&&d.version&&dv!==d.version) showBanner('The Google Sheet has newer data than when you started editing.',true); } else { localStorage.removeItem(LS_DRAFT); S.panels=[]; applySheetData(d,false); } } }).catch(function(e){ errs.push('Panels: '+e.message); });
  return Promise.all([pc,pp]).then(function(){
    syncing=false; renderAll();
    if(errs.length){ setStatus('err', errs.join(' · ')); toast(errs.join(' · '), true, 6000); }
    else setStatus('ok', 'Synced '+fmtTime(Date.now())+' · '+CAT.n.toLocaleString('en-IN')+' codes · '+IMG.size.toLocaleString('en-IN')+' images · '+S.panels.length+' panels');
  });
}
function showBanner(html, withDiscard){
  var b=$('banner'); b.className='banner';
  b.innerHTML='<span>'+html+'</span><span class="spacer"></span>'+(withDiscard?'<button class="btn sm danger" id="bnDiscard">Discard my changes &amp; load Sheet</button>':'')+'<button class="btn sm" id="bnClose">✕</button>';
  $('bnClose').onclick=function(){ b.className='banner hide'; };
  if(withDiscard) $('bnDiscard').onclick=function(){ ask({title:'Discard unsaved changes?',text:'Your edits that are not saved to the Google Sheet will be lost and the panels will be reloaded from the Sheet.',ok:'Discard & reload',danger:true}).then(function(r){ if(!r) return; localStorage.removeItem(LS_DRAFT); S.panels=[]; S.loadedPanels=false; b.className='banner hide'; syncAll(); }); };
}
function savePanels(force){
  if(!CFG.scriptUrl){ openSettings('To save changes to the Google Sheet, paste the Apps Script web-app URL below (setup steps are listed).'); return; }
  var data=serialize(S.panels);
  var names={}, dup=null; S.panels.forEach(function(p){ if(names[p.name]) dup=p.name; names[p.name]=1; });
  if(dup){ toast('Two panels are named '+dup+' — rename one first', true); return; }
  var btn=$('btnSave'); btn.disabled=true; btn.textContent='Saving…'; setStatus('busy','Saving to Google Sheet…');
  fetch(CFG.scriptUrl,{method:'POST', body:JSON.stringify({key:CFG.key, action:'save', baseVersion:S.version, force:!!force, areas:data.areas, panels:data.panels})})
  .then(function(r){ return r.json(); })
  .then(function(j){
    if(j && j.ok){
      S.version=j.version; S.base=clone(S.panels); localStorage.removeItem(LS_DRAFT);
      saveJSON(LS_SHEET,{time:Date.now(),version:j.version,areas:data.areas,panels:data.panels});
      $('banner').className='banner hide';
      toast('Saved to Google Sheet · '+data.areas.length+' items in '+data.panels.length+' panels');
      setStatus('ok','Saved '+fmtTime(Date.now()));
      renderAll();
    } else if(j && j.error==='VERSION_CONFLICT'){
      updateSaveBtn();
      ask({title:'Sheet was changed elsewhere',text:'Someone saved panels from another device after you loaded them. Overwrite the Sheet with your version, or cancel and use "Discard my changes & load Sheet" to get theirs.',ok:'Overwrite with mine',danger:true}).then(function(r){ if(r) savePanels(true); });
    } else { throw new Error((j&&j.error)||'Unknown error'); }
  }).catch(function(e){ updateSaveBtn(); setStatus('err','Save failed: '+e.message); toast('Save failed: '+e.message+' — your changes are kept on this device', true, 6000); });
}

/* ================= TAG GEOMETRY ================= */
/* ================= TAG GEOMETRY (fixed portrait tags, 4 per A4) ================= */
var TT={pad:2.2, cw:[36,40,24], foot:3.4};
function tagDims(){ return {w:clamp(+P.tagW||101.6,50,105), h:clamp(+P.tagH||145,70,148.5)}; }
function liveItems(p){ return p.items.filter(function(i){ return String(i.code||'').trim(); }); }
function headH(p){ return {bh:P.banner?13:0, th:p.title?6:0, hh:9.6}; }
function rowSpace(p){ var d=tagDims(), H=headH(p); return d.h-2*TT.pad-H.bh-H.th-H.hh-TT.foot-1.6; }
function maxRows(p){ return Math.max(1, Math.floor(rowSpace(p)/(+P.minRow||10))); }
function autoTags(p){ return Math.max(1, Math.ceil(liveItems(p).length/maxRows(p))); }
function tagCount(p){ var o=parseInt(p.size,10); return o>0?o:autoTags(p); }
function splitPanel(p){
  var items=liveItems(p), k=tagCount(p), per=Math.ceil(Math.max(items.length,1)/k), out=[];
  for(var i=0;i<k;i++){ var part=items.slice(i*per,(i+1)*per); if(!part.length && i>0) break; out.push({p:p, items:part, idx:i, start:i*per, per:per}); }
  out.forEach(function(t){ t.of=out.length; });
  return out;
}
function panelWarn(p){ var w={noCode:0,noImg:0,noMrp:0}; liveItems(p).forEach(function(it){ var f=info(it.code); if(!f.known) w.noCode++; else if(!isFinite(f.mrp)) w.noMrp++; if(!f.img) w.noImg++; }); w.total=w.noCode+w.noImg+w.noMrp; return w; }
function panelTotal(p){ var t=0; liveItems(p).forEach(function(it){ var f=info(it.code); if(it.qty>0 && isFinite(f.mrp)) t+=f.mrp*it.qty; }); return t; }
function mm(v){ return (Math.round(v*100)/100)+'mm'; }
function plain(n){ return isFinite(n)?String(Math.round(n)):'—'; }
/* one 4x6-style tag: banner + table CODE | PRODUCT IMAGE | MRP | ITEM NAME */
function renderTag(t){
  var p=t.p, d=tagDims(), H=headH(p), total=panelTotal(p);
  var raw=rowSpace(p)/Math.max(t.per,1), r=Math.min(raw,28);
  var D=!!p.showDesc;
  var fCode=D?clamp(r*0.27,1.8,3.4):clamp(r*0.29,2,3.8), fMrp=D?clamp(r*0.30,2.1,4.0):clamp(r*0.33,2.3,4.4), fQ=clamp(r*0.17,1.5,2.2), fDesc=clamp(r*0.19,1.6,2.5);
  var cw=TT.cw;
  if(D){ /* picture column only as wide as the picture needs (picture size is set by row height), rest goes to code / description / MRP */
    var W=d.w-2*TT.pad-0.6, imgMM=Math.min((r-0.6)*1.14*1.15+2, W*0.40), rest=100-imgMM/W*100;
    cw=[rest*0.33, imgMM/W*100, rest*0.41, rest*0.26];
  }
  var h='<div class="ttag" style="width:'+mm(d.w)+';height:'+mm(d.h)+';padding:'+mm(TT.pad)+'">';
  if(P.banner) h+='<div class="tt-banner" style="height:'+mm(H.bh)+'"><img src="'+BANNER+'" alt=""></div>';
  if(p.title) h+='<div class="tt-title fit1" style="height:'+mm(H.th)+';font-size:'+mm(H.th*0.52)+'">'+esc(p.title)+'</div>';
  h+='<div class="tt-box">';
  /* header bar */
  h+='<div class="tt-head" style="height:'+mm(H.hh)+'">';
  h+='<div class="th-c" style="width:'+cw[0]+'%"><span class="th-k">DISPLAY</span><span class="th-name fit1" style="font-size:'+mm(4.3)+'">'+esc(p.name)+(t.of>1?'<small> '+(t.idx+1)+'/'+t.of+'</small>':'')+'</span></div>';
  h+='<div class="th-c th-mid" style="width:'+cw[1]+'%">'+(D?'<span class="th-lbl fit1" style="font-size:1.75mm;letter-spacing:.14em;max-width:100%">PRODUCT</span>':'<span class="th-lbl">PRODUCT</span>')+'</div>';
  if(D) h+='<div class="th-c th-mid" style="width:'+cw[2]+'%;border-left:0"><span class="th-lbl fit1" style="font-size:1.75mm;letter-spacing:.16em">DESCRIPTION</span></div>';
  h+='<div class="th-c" style="width:'+cw[D?3:2]+'%">'+(p.showTotal!==false&&total>0?'<span class="th-k">MRP TOTAL</span><span class="th-tot fit1" style="font-size:'+mm(D?2.9:3.3)+'">₹ '+inr(total)+'/-</span>':'<span class="th-lbl">MRP ₹</span>')+'</div>';
  h+='</div>';
  /* rows */
  t.items.forEach(function(it, i){
    var f=info(it.code);
    h+='<div class="tt-row'+(i%2?' alt':'')+'" style="height:'+mm(r)+'">';
    h+='<div class="tc" style="width:'+cw[0]+'%"><div class="t-code fitw" style="font-size:'+mm(fCode)+'">'+esc(f.code)+'</div></div>';
    h+='<div class="tc t-img" style="width:'+cw[1]+'%">'+(f.img?'<img src="'+esc(f.img)+'" alt="" style="max-height:'+mm(r-0.6)+'" onerror="this.outerHTML=\'<span class=noimg>image coming soon</span>\'">':'<span class="noimg">image coming soon</span>')+'</div>';
    if(D) h+='<div class="tc" style="width:'+cw[2]+'%"><div class="t-desc fith" style="font-size:'+mm(fDesc)+'">'+esc(f.desc||'')+'</div></div>';
    h+='<div class="tc t-mrpc" style="width:'+cw[D?3:2]+'%"><div class="t-mrp fitw" style="font-size:'+mm(fMrp)+'"><span class="rs">₹</span>'+inr(f.mrp)+'</div>'+(it.qty>1?'<div class="t-q" style="font-size:'+mm(fQ)+'">× '+it.qty+' pcs</div>':'')+'</div>';
    h+='</div>';
  });
  h+='</div>';
  h+='<div class="tt-foot" style="height:'+mm(TT.foot)+'"><span>MRP in ₹ · inclusive of all taxes</span></div>';
  h+='</div>';
  return h;
}
function fitTexts(root){
  var els=root.querySelectorAll('.fitw,.fit1'), i, el, fs, min, g;
  for(i=0;i<els.length;i++){ el=els[i]; fs=parseFloat(el.style.fontSize); min=fs*0.5; g=0; while(el.scrollWidth>el.clientWidth+0.5 && fs>min && g++<25){ fs*=0.93; el.style.fontSize=fs.toFixed(3)+'mm'; } }
  els=root.querySelectorAll('.fith2');
  for(i=0;i<els.length;i++){ el=els[i]; fs=parseFloat(el.style.fontSize); g=0; while(el.scrollHeight>el.clientHeight+0.5 && fs>1.3 && g++<14){ fs*=0.92; el.style.fontSize=fs.toFixed(3)+'mm'; } }
  els=root.querySelectorAll('.fith');
  for(i=0;i<els.length;i++){ el=els[i]; fs=parseFloat(el.style.fontSize); min=fs*0.72; g=0; while(el.scrollHeight>el.clientHeight+0.5 && fs>min && g++<12){ fs*=0.94; el.style.fontSize=fs.toFixed(3)+'mm'; } if(el.scrollHeight>el.clientHeight+0.5) el.classList.add('clamp'); }
}
function withZoom1(wrap, fn){ var z=wrap.style.zoom; wrap.style.zoom='1'; try{ fn(); } finally { wrap.style.zoom=z; } }

/* ================= PACKING: 4 tags per A4, 2 x 2, butted together ================= */
function pack(tags){ var pages=[]; for(var i=0;i<tags.length;i+=4) pages.push(tags.slice(i,i+4)); return pages; }
function sheetBox(){ var d=tagDims(); return {w:d.w, h:d.h, x0:(210-2*d.w)/2, y0:(297-2*d.h)/2}; }
function renderSheet(pg){
  var b=sheetBox(), h='<div class="sheet">';
  pg.forEach(function(t,i){ var x=b.x0+(i%2)*b.w, y=b.y0+Math.floor(i/2)*b.h; h+='<div class="slot" style="left:'+mm(x)+';top:'+mm(y)+';width:'+mm(b.w)+';height:'+mm(b.h)+'">'+renderTag(t)+'</div>'; });
  if(P.cut){
    [b.x0, b.x0+b.w, b.x0+2*b.w].forEach(function(x){ h+='<div class="cut-v" style="left:'+mm(x)+';top:0;height:297mm"></div>'; });
    [b.y0, b.y0+b.h, b.y0+2*b.h].forEach(function(y){ h+='<div class="cut-h" style="left:0;top:'+mm(y)+';width:210mm"></div>'; });
  }
  return h+'</div>';
}

/* ================= RENDER: PANEL LIST ================= */
function renderPanelList(){
  var box=$('panelList'), q=$('plSearch').value.trim().toUpperCase(), ch=changedSet(), h='';
  if(!S.panels.length){ box.innerHTML='<div class="empty" style="padding:16px">No panels yet</div>'; return; }
  S.panels.forEach(function(p){
    if(q){ var hit=p.name.indexOf(q)>=0 || (p.title||'').toUpperCase().indexOf(q)>=0 || p.items.some(function(i){ return String(i.code).toUpperCase().indexOf(q)>=0; }); if(!hit) return; }
    var k=tagCount(p), w=panelWarn(p);
    h+='<div class="pl-item'+(p.uid===S.sel?' on':'')+'" data-uid="'+p.uid+'" draggable="true">';
    h+='<span class="pl-grip">⋮⋮</span><div class="pl-main"><div class="pl-name">'+esc(p.name)+(ch[p.uid]?' <span class="chg" title="Unsaved changes"></span>':'')+'</div>'+(p.title?'<div class="pl-title">'+esc(p.title)+'</div>':'')+'</div>';
    h+='<div class="pl-meta">'+(w.total?'<span class="warn" title="'+w.total+' item(s) need attention">!</span>':'')+'<span>'+liveItems(p).length+'</span><span class="sz sz-'+(k===1?'S':k===2?'M':'L')+'" title="Number of 4×6 tags">'+k+' tag'+(k>1?'s':'')+'</span></div></div>';
  });
  box.innerHTML=h||'<div class="empty" style="padding:16px">No match</div>';
}
function updateSaveBtn(){
  var d=dirtyInfo(), b=$('btnSave');
  b.disabled=!d.dirty; b.innerHTML=d.dirty?('Save to Sheet <span class="badge">'+(d.n||'•')+'</span>'):'Saved ✓';

function searchCat(q, limit){

    if(one && CAT.cu[i].indexOf(q)===0){ pre.push(i); if(pre.length>=limit) break; continue; }
    hay=CAT.hay[i]; ok=true; for(k=0;k<toks.length;k++){ if(hay.indexOf(toks[k])<0){ ok=false; break; } }

function groupUpload(rows){
  rows=(rows||[]).filter(function(r){ return r && r.some(function(c){ return String(c==null?'':c).trim(); }); });
  if(!rows.length) return {groups:[],skipped:0,headerFound:false};
  var h=rows[0].map(normH), ia=hdrIndex(h,['AREA','PANEL','DISPLAY']), ic=hdrIndex(h,['CODE','CODES','ITEM CODE']), iq=hdrIndex(h,['QTY','QUANTITY']), is=hdrIndex(h,['SERIES','SNO','S NO','SR']);
  var headerFound=ic>=0 && ia>=0;
  if(headerFound) rows=rows.slice(1); else { ia=0; ic=1; iq=2; is=-1; }
  var map={}, order=[], skipped=0;
  rows.forEach(function(r,i){
    var a=String(r[ia]==null?'':r[ia]).trim().toUpperCase(), c=String(r[ic]==null?'':r[ic]).trim().toUpperCase();
    if(!a||!c){ skipped++; return; }
    var q=iq>=0?num(r[iq]):NaN; q=q>0?Math.round(q):0;

    map[a].rows.push({code:canon(c),qty:q,s:isFinite(sr)?sr:1e9,i:i});
  });
  order.forEach(function(g){ g.rows.sort(function(x,y){ return (x.s-y.s)||(x.i-y.i); }); g.items=g.rows.map(function(x){ return {code:x.code,qty:x.qty}; }); delete g.rows; });

function waitImages(root, ms){
  var imgs=[].slice.call(root.querySelectorAll('img')), done=0, total=imgs.length;
  return new Promise(function(res){

    var t=setTimeout(res, ms||20000);
    function one(){ done++; if(done%10===0) setStatus('busy','Loading pictures '+done+'/'+total+'…'); if(done>=total){ clearTimeout(t); res(); } }
    imgs.forEach(function(im){ if(im.complete) one(); else { im.addEventListener('load',one); im.addEventListener('error',one); } });
  });
}

function ask(o){
  return new Promise(function(res){
    var bg=document.createElement('div'); bg.className='modal-bg';
    var h='<div class="modal"><h3>'+esc(o.title||'')+'</h3>'+(o.text?'<p>'+o.text+'</p>':'')+(o.html||'');
    (o.fields||[]).forEach(function(f){ h+='<div class="field"><label>'+esc(f.label)+'</label>'+(f.type==='textarea'?'<textarea data-f="'+f.id+'" rows="10" spellcheck="false">'+esc(f.value||'')+'</textarea>':'<input data-f="'+f.id+'" value="'+esc(f.value||'')+'" spellcheck="false">')+'</div>'; });
    h+='<div class="modal-actions">'+(o.extra||'')+'<button class="btn" data-x="0">Cancel</button><button class="btn '+(o.danger?'danger':'primary')+'" data-x="1">'+esc(o.ok||'OK')+'</button></div></div>';
    bg.innerHTML=h; document.body.appendChild(bg);
    var first=bg.querySelector('[data-f]'); if(first) setTimeout(function(){ first.focus(); },30);
    function close(v){ document.removeEventListener('keydown',kd); bg.remove(); res(v); }
    function val(){ var r={}; bg.querySelectorAll('[data-f]').forEach(function(x){ r[x.dataset.f]=x.value; }); return (o.fields&&o.fields.length)?r:true; }
    function kd(e){ if(e.key==='Escape') close(null); if(e.key==='Enter' && e.target.tagName==='INPUT'){ e.preventDefault(); close(val()); } }
    document.addEventListener('keydown',kd);
    bg.addEventListener('click',function(e){ var b=e.target.closest('[data-x]'); if(b) close(b.dataset.x==='1'?val():null); else if(e.target===bg) close(null); });
    if(o.onOpen) o.onOpen(bg, close);
  });
}

}

/* ================= SHELL ================= */
function setView(v){ S.view=v; $('viewEdit').classList.toggle('on',v==='edit'); $('viewPrint').classList.toggle('on',v==='print'); $('tabEdit').classList.toggle('on',v==='edit'); $('tabPrint').classList.toggle('on',v==='print'); hideAC(); if(v==='print') renderPrint(); else renderEditor(); }
function renderAll(){ updateSaveBtn(); renderPanelList(); if(S.view==='print') renderPrint(); else renderEditor(); }
$('tabEdit').onclick=function(){ setView('edit'); };
$('tabPrint').onclick=function(){ setView('print'); };
$('btnSave').onclick=function(){ savePanels(false); };
$('btnUndo').onclick=undo;
$('btnRefresh').onclick=function(){ if(dirtyInfo().dirty) toast('Catalogue refreshed — your unsaved panel edits are kept'); syncAll(); };
$('btnSettings').onclick=function(){ openSettings(); };
$('btnNewPanel').onclick=newPanel;
$('btnUpload').onclick=openUpload;
$('btnPrint').onclick=doPrint;
$('plSearch').oninput=renderPanelList;
$('pvZoom').oninput=function(){ var z=this.value/100; document.querySelectorAll('.pv-z').forEach(function(w){ w.style.zoom=z; }); };
document.addEventListener('keydown',function(e){ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.shiftKey){ var t=e.target.tagName; if(t==='INPUT'||t==='TEXTAREA') return; e.preventDefault(); undo(); } });
window.addEventListener('beforeunload',function(e){ if(dirtyInfo().dirty){ saveDraft(); } });
window.addEventListener('resize',hideAC);
document.addEventListener('scroll',function(e){ if(AC.el && !e.target.closest) hideAC(); else if(AC.el && e.target!==$('ac') && !(e.target.closest&&e.target.closest('#ac'))) hideAC(); },true);
bindPanelList();

/* ================= BOOT ================= */
(function boot(){
  setStatus('busy','Opening…');
  var cached=loadJSON(LS_SHEET,null);
  if(cached) applySheetData(cached,true);
  else { var draft=loadJSON(LS_DRAFT,null); if(draft&&draft.panels){ S.panels=draft.panels; S.sel=S.panels[0]?S.panels[0].uid:null; } }
  renderAll();
  Promise.all([idbGet('cat_csv'),idbGet('img_csv')]).then(function(t){
    if(t[0]&&t[1]&&!CAT.n){ try{ CAT=buildCatalogue(t[0]); IMG=buildImages(t[1]); renderAll(); setStatus('busy','Showing saved copy · checking Google Sheets…'); }catch(e){} }
  }).then(function(){ syncAll(); });
})();
</script>
